[project]
name = "release-assistant"
version = "0.1.0"
description = "Enterprise DevOps Release Assistant powered by Google ADK and Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.1.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
